<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,
        body {
            background-color: #000000;
            display: grid;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .center {
            height: 2rem;
            aspect-ratio: 1/1;
            background-color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .center .ripple {
            background-color: white;
            height: .5rem;
            aspect-ratio: 1/1;
            border-radius: 50%;
            position: relative;
            animation: ripple 1s ease-in-out infinite;
        }

        @keyframes ripple {
            from {
                transform: scale(.5);
                opacity: 1;
            }

            to {
                transform: scale(15);
                opacity: 0;
            }
        }
    </style>
</head>

<body>
    <div class="center">
        <div class="ripple"></div>
    </div>
</body>

</html>
